<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ARAZUKI Studio</title>
<style>
  :root { --bg:#0f1210; --fg:#eef2ee; --dim:#a8aea8; --accent:#7a9444; --glow:#d4e090; --line:#2a302b; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:Inter, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:96px 20px; }
  h1 { font-size:clamp(44px, 10vw, 72px); letter-spacing:.06em; line-height:1; margin:0; color:var(--glow); }
  h1 small { display:block; font-size:.3em; letter-spacing:.3em; color:var(--accent); margin-top:8px; }
  p { font-size:16px; line-height:1.7; color:var(--dim); margin:28px 0 0; }
  a { color:var(--glow); text-decoration:none; border-bottom:1px solid var(--accent); }
  footer { margin-top:64px; padding-top:20px; border-top:1px solid var(--line); color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>ARAZUKI<small>STUDIO</small></h1>
  <p>준비 중입니다 · Coming soon.</p>
  <p>Contact: <a href="mailto:contact@arazukistudio.com">contact@arazukistudio.com</a> · <a href="/privacy/">Privacy Policy</a></p>
  <footer>© ARAZUKI Studio</footer>
</main>
</body>
</html>
